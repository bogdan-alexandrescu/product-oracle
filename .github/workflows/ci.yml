name: CI

# CI runs on merges to main only, never on pull requests (BGD, Nov 12, 2026: "no testing in prs,
# just testing in ci on merges to main"): work lands in large merge trains, each train is tested
# once by the push run its merge starts, and a deploy waits for that run. workflow_dispatch runs it
# by hand on any branch when one needs checking before it merges.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Each main push is its own group (by commit), so a merge never drops the run of the merge before it;
# cancel-superseded below cancels the older runs once a newer one (which contains them) starts.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

# Self-hosted runners (BGD, Nov 6, 2026: "Share SwarmCloud's pool"): with the repository variable
# SELF_HOSTED_CI set to 'on', every job runs on the shared runner dispatcher's VMs (one
# e2-standard-8 per job, label ORACLE_CI_RUNNER_LABEL, default bogdan-ci, SwarmCloud's pool);
# unset or anything else, on GitHub's hosted runners. Turn it off to fall back at once. The fork
# check below keeps this file's own fork runs hosted, but it is not a control: a fork's pull request
# runs its own copy of this workflow and can ask for any label. The control is the repository's
# Actions setting "require approval for all outside contributors": read any workflow change in an
# outside pull request before approving its run (the pool's VMs have passwordless sudo).
#
# Every action is pinned to a full commit SHA and every image to a digest (#1565): a moved tag
# would run new code on the pool. The comment names the version; bump both together.
jobs:
  # #1564: a main push cancels this workflow's older main runs still in progress (their commits
  # are in this run), never one whose deploy job has started (.github/scripts/cancel_superseded_runs.py).
  cancel-superseded:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/cancel_superseded_runs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # #1563: the suite split 4 ways by file, balanced by api/tests/shard_durations.json (per-file
  # seconds, refreshed from the shards' api-junit-N artifacts: see api/tests/_shard.py). 4 keeps a
  # shard under the slowest mock-e2e shard (~32 min) on GitHub's runners too. Each shard has its
  # own Postgres service.
  api:
    runs-on: ${{ vars.SELF_HOSTED_CI == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.ORACLE_CI_RUNNER_LABEL || 'bogdan-ci')) || 'ubuntu-latest' }}
    # One pytest worker per core: 8 on the pool's e2-standard-8 VMs, 4 on GitHub's hosted
    # runners (the whole suite took ~70-90 min on 4 workers). A hung shard frees its runner after 60.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: api
    env:
      ORACLE_TEST_DATABASE_URL: postgresql+asyncpg://oracle:oracle@localhost:5432/oracle_test
      # PDF export (WeasyPrint) needs Pango; make the PDF test fail rather than skip.
      ORACLE_REQUIRE_PDF: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      # Each worker (one per core) drops and builds the whole schema in its own database
      # (oracle_test_gw0, ...); Postgres's default lock table runs out of shared memory
      # for that. The lock table holds max_locks_per_transaction x max_connections, so
      # both grow with the workers: 50 connections each (a worker's engine pools up to
      # 15, plus the migration tests' scratch engines). The database is thrown away, so
      # no waiting on the disk either (every test commits a TRUNCATE). Service
      # containers take no command: set, restart.
      - name: Postgres settings for parallel tests
        working-directory: .
        run: |
          id=${{ job.services.postgres.id }}
          workers=$(nproc)
          echo "PYTEST_WORKERS=$workers" >> "$GITHUB_ENV"
          docker exec "$id" psql -U oracle -d oracle_test \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 256" \
            -c "ALTER SYSTEM SET max_connections = $((workers * 50))" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$id"
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] && break
            sleep 2
          done
          docker exec "$id" psql -U oracle -d oracle_test -tAc "SHOW max_locks_per_transaction" | grep -qx 256
          docker exec "$id" psql -U oracle -d oracle_test -tAc "SHOW max_connections" | grep -qx "$((workers * 50))"
      - run: uv sync --frozen
      - if: matrix.shard == 1
        run: uv run ruff check .
      - if: matrix.shard == 1
        run: uv run ruff format --check .
      - run: ../.github/scripts/api_pytest.sh ${{ matrix.shard }} 4
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-junit-${{ matrix.shard }}
          path: api/junit/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-coverage-${{ matrix.shard }}
          path: api/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  # #1567: the shards' coverage combined must stay at or above api/coverage-floor.json, which only
  # rises (.github/scripts/coverage_floor.py). gh downloads the shards' data: no extra Action.
  coverage-floors:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: gh run download "$GITHUB_RUN_ID" --pattern 'api-coverage-*' --dir "$RUNNER_TEMP/coverage"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          cp "$RUNNER_TEMP"/coverage/api-coverage-*/.coverage.shard-* .
          uv run coverage combine
          uv run coverage json -o coverage.json
      - run: python3 ../.github/scripts/coverage_floor.py --self-test
      - run: python3 ../.github/scripts/coverage_floor.py check coverage.json

  # #1568: pyright (basic mode, pyrightconfig.json) on api/oracle; only errors that are not in
  # .github/scripts/pyright-baseline.json fail (.github/scripts/pyright_baseline.py).
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: cd api && uv sync --frozen
      - run: cd web && npm ci
      # pyright exits 1 when it finds errors (the baseline decides) and 2 or more when it fails.
      - run: web/node_modules/.bin/pyright --outputjson > "$RUNNER_TEMP/pyright.json" || [ $? -eq 1 ]
      - run: python3 .github/scripts/pyright_baseline.py --self-test
      - run: python3 .github/scripts/pyright_baseline.py check "$RUNNER_TEMP/pyright.json"

  # Tests that assert a wall-clock limit (marker `timing`) run alone, on GitHub's hosted runners
  # where their budgets were tuned: on the pool's VMs four of them miss their budget on main itself
  # (Nov 6: the Inbox checkpoint p95 and three run-ticker timings), as e2e-timing's did.
  api-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: api
    env:
      ORACLE_TEST_DATABASE_URL: postgresql+asyncpg://oracle:oracle@localhost:5432/oracle_test
      ORACLE_REQUIRE_PDF: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -p no:cacheprovider -m timing

  web:
    runs-on: ${{ vars.SELF_HOSTED_CI == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.ORACLE_CI_RUNNER_LABEL || 'bogdan-ci')) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Generated API types are up to date
        working-directory: .
        run: |
          (cd api && uv sync --frozen)
          make openapi
          git diff --exit-code -- web/lib/api || (echo "Run 'make openapi' and commit the result" && exit 1)
      - run: npm run lint
      # A spec that measures elapsed time is tagged @timing, so it runs alone in e2e-timing.
      - name: Timing specs are tagged @timing
        run: node scripts/check-timing-tags.mjs
      - name: Repo tools pass their self-tests
        run: node scripts/replace.mjs --self-test && node scripts/mutate.mjs --self-test
      # #1570: the docs' published contracts (docs/contracts/docs-*.json) say what the docs say.
      - name: Docs contracts match the docs
        run: python3 ../docs/contracts/check.py
      - run: npm run build

  e2e:
    runs-on: ${{ vars.SELF_HOSTED_CI == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.ORACLE_CI_RUNNER_LABEL || 'bogdan-ci')) || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && for i in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; echo "Playwright install failed (try $i of 3; an Ubuntu mirror is often down for a minute), retrying in 30 s"; sleep 30; done
      # Postgres is the service above, so the target must not start the compose one.
      - run: make e2e E2E_POSTGRES=
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: web/test-results/

  # BGD, Nov 6, 2026 ("Move it to CI, sharded"), and Nov 12 (CI on main pushes only): every push to
  # main runs the whole mock-backed Playwright suite here, split 8 ways on the runner pool.
  # Each shard builds the mock app once, then runs its share with the e2e/ci.env settings.
  mock-e2e:
    runs-on: ${{ vars.SELF_HOSTED_CI == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.ORACLE_CI_RUNNER_LABEL || 'bogdan-ci')) || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Full history, origin/main with it: the prose guard reads its merge base's ceilings and
      # never fetches itself, so it always runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && for i in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; echo "Playwright install failed (try $i of 3; an Ubuntu mirror is often down for a minute), retrying in 30 s"; sleep 30; done
      - run: cd web && npm run build:mock
      # The prose guard compares against main before this push (the train's merge base), not main itself.
      - run: cd web && E2E_PREBUILT=1 E2E_WORKERS=4 npm run test:ci -- --shard=${{ matrix.shard }}/8
        env:
          PROSE_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mock-e2e-results-${{ matrix.shard }}
          path: web/test-results/

  # dod-perf review: the web's timing specs (tagged @timing, as the API's `timing` mark) on the
  # mock-backed build, alone (one worker) so no other test's load counts against them.
  e2e-timing:
    runs-on: ubuntu-latest  # timing budgets are tuned on GitHub's runners; the pool's VMs draw the 500-item views ~50 ms slower
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && for i in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; echo "Playwright install failed (try $i of 3; an Ubuntu mirror is often down for a minute), retrying in 30 s"; sleep 30; done
      - run: cd web && E2E_TIMING=1 npx playwright test --grep @timing --workers=1
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-timing-results
          path: web/test-results/
