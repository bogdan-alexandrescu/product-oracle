<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>You're invited to join $company on Product Oracle</title>
<style>
  body{margin:0;padding:0;width:100%!important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
  table{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;}
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;}
  a{text-decoration:none;}
  @media only screen and (max-width:620px){
    .wrap{width:100%!important;}
    .px{padding-left:24px!important;padding-right:24px!important;}
    .btn a{display:block!important;}
    .btn{width:100%!important;}
  }
  @media (prefers-color-scheme: dark){
    .bg{background:#06101e!important;}
    .card{background:#0c1a2e!important;border-color:#1e3350!important;}
    .band{background:#11233b!important;}
    .t1{color:#eef4fa!important;} .t2{color:#9fb0c4!important;} .t3{color:#828d9b!important;}
    .chip{background:#10294a!important;color:#b9e3fc!important;}
    .quote{background:#11233b!important;border-left-color:#7cc8f8!important;}
    .meta{background:#11233b!important;}
    .acc{color:#7cc8f8!important;}
    .b{background:#7cc8f8!important;} .b-a{color:#06101e!important;}
  }
</style>
</head>
<body class="bg" style="margin:0;padding:0;background:#eef4fa;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:transparent;">$preheader&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background:#eef4fa;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="wrap card" style="border-collapse:separate;width:600px;max-width:600px;background:#ffffff;border:1px solid #d6e0ea;border-radius:16px;">
<tr><td class="band px" bgcolor="#0c1a2e" style="background:#0c1a2e;background-image:linear-gradient(135deg,#0c1a2e 0%,#173052 100%);border-radius:15px 15px 0 0;padding:24px 40px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
    <td style="vertical-align:middle;"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="padding-right:10px;"><img src="cid:$cid" width="28" height="28" alt="" style="display:block;width:28px;height:28px;border-radius:7px;"></td>
      <td style="font-family:$font;font-size:16px;font-weight:700;letter-spacing:-0.01em;color:#eef4fa;">Product Oracle</td>
    </tr></table></td>
    <td align="right" style="vertical-align:middle;font-family:$font;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#7cc8f8;">Invitation</td>
  </tr></table>
</td></tr>
<tr><td class="px" style="padding:36px 40px 0 40px;">
  <h1 class="t1" style="margin:0 0 16px 0;font-family:$font;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-0.015em;color:#0d1724;">$inviter invited you to join $company_heading on Product&nbsp;Oracle</h1>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td class="chip" style="background:#e5f3fc;border-radius:999px;padding:4px 12px;font-family:$font;font-size:13px;line-height:20px;font-weight:600;color:#075985;">$role</td></tr></table>
</td></tr>
$note<tr><td class="px" align="center" style="padding:32px 40px 0 40px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="btn"><tr>
<td class="b" align="center" bgcolor="#0369a1" style="border-radius:10px;background:#0369a1;">
<!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="$link" style="height:48px;v-text-anchor:middle;width:200px;" arcsize="20%" fillcolor="#0369a1" stroke="f"><center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">Open Oracle</center></v:roundrect><![endif]-->
<!--[if !mso]><!--><a href="$link" class="b-a" style="display:inline-block;padding:14px 36px;font-family:$font;font-size:16px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">Open Oracle</a><!--<![endif]-->
</td></tr></table>
  <p class="t3" style="margin:12px 0 0 0;font-family:$font;font-size:12px;line-height:18px;color:#606a77;word-break:break-all;"><a href="$link" class="acc" style="color:#0369a1;text-decoration:underline;">$link</a></p>
</td></tr>
<tr><td class="px" style="padding:28px 40px 36px 40px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
    <td class="meta" style="background:#f3f6f9;border-radius:10px;padding:14px 16px;font-family:$font;font-size:13px;line-height:21px;color:#4f5d6e;">
      <span class="t2">Sign in with Google using <strong class="t1" style="color:#0d1724;">$to</strong></span>$expiry
    </td></tr></table>
</td></tr>
</table>
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="wrap" style="width:600px;max-width:600px;">
<tr><td class="px t3" align="center" style="padding:20px 40px 0 40px;font-family:$font;font-size:12px;line-height:19px;color:#606a77;">
  You got this because $because invited $to.<br>${questions}Not expecting it? Ignore this email.
</td></tr></table>
</td></tr></table>
</body>
</html>
