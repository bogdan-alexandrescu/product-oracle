[project]
name = "product-oracle-api"
version = "0.1.0"
description = "Product Oracle API (MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.15.1",
    "itsdangerous==2.2.0",
    # Pre-added for lanes 1-3 so they do not fight over uv.lock:
    "pyyaml==6.0.3",
    "markdown-it-py==4.2.0",
    "jinja2==3.1.6",
    "weasyprint==70.0",
    "httpx==0.28.1",
    # Pre-added for the v1 lanes so they do not fight over the lockfiles:
    "mcp==2.3.0",  # official MCP SDK: the Streamable HTTP server at /mcp
    "python-multipart==0.0.32",  # multipart uploads
    "cryptography==50.0.2",  # Fernet + HKDF for source credentials
    "pypdf==6.21.0",  # PDF uploads (was a dev dependency for export tests)
    "python-pptx==1.0.2",  # Deck export (O1f): the brief layer as PPTX slides
    "sqlglot==30.24.0",  # parses metric HogQL (ClickHouse dialect) for check_query
]

[project.scripts]
oracle = "oracle.cli.oracle_cli:main"
oracle-seed = "oracle.seed:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.1",
    "pytest-cov==7.1.0",  # #1567: the coverage floor
    "coverage==7.17.2",
]

# #1566: a release resolves only once it is 14 days old; exclude-newer-package lets an urgent
# security fix skip it.
[tool.uv]
exclude-newer = "14 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# A test that runs past 15 minutes is stuck: its worker prints every thread's stack and exits,
# so the run names it and goes on instead of waiting out the CI job.
faulthandler_timeout = 900
faulthandler_exit_on_timeout = true
markers = [
    "timing: asserts a wall-clock limit; CI runs these alone, after the parallel run, so other workers' load does not count",
]
