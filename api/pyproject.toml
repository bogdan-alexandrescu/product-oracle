[project]
name = "product-oracle-api"
version = "0.1.0"
description = "Product Oracle API (MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "itsdangerous>=2.2",
    # Pre-added for lanes 1-3 so they do not fight over uv.lock:
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "httpx>=0.27",
    # Pre-added for the v1 lanes so they do not fight over the lockfiles:
    "mcp>=2.3",  # official MCP SDK: the Streamable HTTP server at /mcp
    "python-multipart>=0.0.20",  # multipart uploads
    "cryptography>=45",  # Fernet + HKDF for source credentials
    "pypdf>=6.21.0",  # PDF uploads (was a dev dependency for export tests)
    "python-pptx>=1.0",  # Deck export (O1f): the brief layer as PPTX slides
    "sqlglot==30.24.0",  # parses metric HogQL (ClickHouse dialect) for check_query
]

[project.scripts]
oracle = "oracle.cli.oracle_cli:main"
oracle-seed = "oracle.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "rituals_wait_for_goal: sees whether the company has a confirmed goal when its built-in rituals are seeded (tests.conftest._rituals_seed_on)",
    "timing: asserts a wall-clock limit; CI runs these alone, after the parallel run, so other workers' load does not count",
]
