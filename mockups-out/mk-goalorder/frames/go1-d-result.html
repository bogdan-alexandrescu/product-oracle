<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="mockup-viewport" content="1440x900">
<style>html,body{margin:0;background:#c9d3de}html[data-theme=dark],html[data-theme=dark] body{background:#08111f}.row{display:flex;gap:16px;padding:16px;box-sizing:border-box;height:100vh}
.pane{flex:1;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 4px 18px rgb(0 0 0/.25)}iframe{border:0;width:1440px;height:1736px;transform:scale(0.4889);transform-origin:0 0;position:absolute}</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);addEventListener("load",function(){if(t)document.querySelectorAll("iframe").forEach(function(f){f.src=f.getAttribute("src").split("?")[0]+"?theme="+t})})})()</script></head>
<body><div class="row"><div class="pane"><iframe src="go1-d-result-home.html" title="Home"></iframe></div><div class="pane"><iframe src="go1-d-result-roadmap.html" title="Roadmap"></iframe></div></div></body></html>
