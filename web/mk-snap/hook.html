<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);function r(){document.querySelectorAll('[data-mk-scroll]').forEach(function(e){var p=e.getAttribute('data-mk-scroll').split(',');e.scrollLeft=+p[0];e.scrollTop=+p[1];});var w=(document.documentElement.getAttribute('data-mk-win')||'0,0').split(',');scrollTo(+w[0],+w[1]);}addEventListener('DOMContentLoaded',r);addEventListener('load',function(){r();setTimeout(r,300);});})();</script>
